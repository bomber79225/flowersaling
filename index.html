<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起賺點零用錢 - 雲端同步小帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const GAS_URL = "https://script.google.com/macros/s/AKfycby7qSpHzKkUeDQixbI2eLS9uk9F4J8ZEWx-5O1yEEdOC01cxfh22u3YGiwn4OIfTUvS/exec"; 
        const PARTNERS = ["慧", "芃", "吟", "哲"];
        const STYLES = [
            { id: '藍', label: '藍', color: 'bg-sky-400', active: 'ring-sky-500 bg-sky-50 text-sky-700 border-sky-200' },
            { id: '粉', label: '粉', color: 'bg-[#e2b4bd]', active: 'ring-[#e2b4bd] bg-[#fdf2f4] text-[#a06a75] border-[#f0d4d9]' },
            { id: '黃', label: '黃', color: 'bg-amber-400', active: 'ring-amber-500 bg-amber-50 text-amber-900 border-amber-300' }
        ];
        const CHANNELS = {
            "現場擺攤": { price: 499, feeRate: 0 },
            "臉書/賣貨便": { price: 499, feeRate: 0 },
            "蝦皮": { price: 590, feeRate: 0.145 },
            "其他": { price: 499, feeRate: 0 }
        };

        const App = () => {
            const [sales, setSales] = useState([]);
            const [costs, setCosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSyncTime, setLastSyncTime] = useState('初始化中...');
            const [sellerName, setSellerName] = useState(localStorage.getItem('seller_name') || '');
            const [saleForm, setSaleForm] = useState({ channel: '現場擺攤', qty: 1, custName: '', custPhone: '', style: '藍' });
            const [costForm, setCostForm] = useState({ item: '', amount: '' });

            const fetchData = useCallback(async (isSilent = false) => {
                if (!isSilent) setLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?t=${Date.now()}`, { cache: 'no-store' });
                    const data = await res.json();
                    if (data && !data.error) {
                        setSales(data.sales || []);
                        setCosts(data.costs || []);
                        setLastSyncTime(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
                    }
                } catch (e) { console.error(e); } finally { setLoading(false); }
            }, []);

            useEffect(() => { 
                fetchData(); 
                const timer = setInterval(() => fetchData(true), 30000);
                return () => clearInterval(timer);
            }, [fetchData]);

            useEffect(() => { lucide.createIcons(); }, [activeTab, loading, sales, costs]);

            // 完美的排序邏輯：將字串轉為 Date 對象進行比對
            const sortedSales = useMemo(() => {
                return [...sales].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            }, [sales]);

            const sortedCosts = useMemo(() => {
                return [...costs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            }, [costs]);

            const syncToGAS = async (payload) => {
                setIsSyncing(true);
                try {
                    await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                    setTimeout(() => fetchData(true), 1200);
                } catch (e) { console.error(e); }
                finally { setTimeout(() => setIsSyncing(false), 800); }
            };

            const stats = useMemo(() => {
                const totalFixedCost = costs.reduce((sum, c) => sum + Number(c.amount || 0), 0);
                const totalGrossRevenue = sales.reduce((sum, s) => sum + Number(s.gross || 0), 0);
                const totalFees = sales.reduce((sum, s) => sum + Number(s.fee || 0), 0);
                const totalQty = sales.reduce((sum, s) => sum + Number(s.qty || 0), 0);
                const profit = (totalGrossRevenue - totalFees) - totalFixedCost;
                return { totalFixedCost, totalGrossRevenue, totalFees, profit, totalQty };
            }, [sales, costs]);

            const handleAddSale = (e) => {
                e.preventDefault();
                if (!sellerName) return alert("請先選銷售員");
                const config = CHANNELS[saleForm.channel];
                const gross = config.price * saleForm.qty;
                const fee = Math.round(gross * config.feeRate);
                const newSale = { 
                    ...saleForm, 
                    action: "addSale",
                    id: 'S' + Date.now(), 
                    timestamp: new Date().toISOString(), // 存入標準 ISO 格式
                    seller: sellerName, 
                    gross, 
                    fee 
                };
                syncToGAS(newSale);
                setSaleForm({ ...saleForm, custName: '', custPhone: '', qty: 1 });
            };

            const handleAddCost = (e) => {
                e.preventDefault();
                const newCost = { 
                    action: "addCost",
                    id: 'C' + Date.now(),
                    timestamp: new Date().toISOString(),
                    item: costForm.item, 
                    amount: Number(costForm.amount) 
                };
                syncToGAS(newCost);
                setCostForm({ item: '', amount: '' });
            };

            const deleteItem = (type, id) => {
                syncToGAS({ action: "delete", type, id });
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold">同步中...</div>;

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 shadow-xl bg-white relative border-x border-slate-100">
                    {/* Header */}
                    <header className="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg">
                        <div className="flex justify-between items-center mb-4">
                            <h1 className="text-xl font-bold flex items-center gap-2"><i data-lucide="sparkles"></i> 一起賺點零用錢</h1>
                            <div className="text-[10px] opacity-70">最後更新: {lastSyncTime}</div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 text-center">
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">銷售總量</p>
                                <p className="text-2xl font-bold">{stats.totalQty} / 200</p>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">目前淨利</p>
                                <p className="text-2xl font-bold">${stats.profit.toLocaleString()}</p>
                            </div>
                        </div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-10 shadow-sm">
                        {['dashboard', 'sales', 'costs'].map(tab => (
                            <button key={tab} onClick={()=>setActiveTab(tab)} className={`flex-1 py-4 text-xs font-bold transition-all ${activeTab===tab?'text-blue-600 border-b-2 border-blue-600 bg-blue-50/30':'text-slate-400'}`}>
                                {tab==='dashboard'?'控制台':tab==='sales'?'流水帳':'支出'}
                            </button>
                        ))}
                    </nav>

                    <main className="p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <section className="bg-white border rounded-2xl p-5 shadow-sm">
                                    <h2 className="font-bold text-slate-700 mb-4 text-[10px] uppercase tracking-widest opacity-60">新訂單登記</h2>
                                    <form onSubmit={handleAddSale} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="text" placeholder="客戶姓名" className="p-3 bg-slate-50 border rounded-xl outline-none" value={saleForm.custName} onChange={(e)=>setSaleForm({...saleForm, custName: e.target.value})} />
                                            <input type="number" placeholder="電話末三碼" className="p-3 bg-slate-50 border rounded-xl outline-none" value={saleForm.custPhone} onChange={(e)=>setSaleForm({...saleForm, custPhone: e.target.value})} />
                                            <select className="p-3 bg-slate-50 border rounded-xl outline-none" value={saleForm.channel} onChange={(e)=>setSaleForm({...saleForm, channel: e.target.value})}>
                                                {Object.keys(CHANNELS).map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                            <input type="number" min="1" className="p-3 bg-slate-50 border rounded-xl outline-none font-bold" value={saleForm.qty} onChange={(e)=>setSaleForm({...saleForm, qty: Number(e.target.value)})} />
                                        </div>
                                        <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-black">確認登記</button>
                                    </form>
                                </section>
                            </div>
                        )}

                        {activeTab === 'sales' && (
                            <div className="space-y-3">
                                {sortedSales.map(s => (
                                    <div key={s.id} className="bg-white border p-4 rounded-2xl flex justify-between items-center shadow-sm">
                                        <div className="flex flex-col">
                                            <span className="font-bold text-sm">{s.style}束 x {s.qty} ({s.channel})</span>
                                            <span className="text-[10px] text-slate-400">客: {s.custName} | 電: {s.custPhone} | {new Date(s.timestamp).toLocaleString()}</span>
                                        </div>
                                        <div className="text-right">
                                            <p className="font-bold text-blue-600">+${(Number(s.gross)-Number(s.fee)).toLocaleString()}</p>
                                            <button onClick={()=>deleteItem('sales', s.id)} className="text-red-400"><i data-lucide="x-circle" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {activeTab === 'costs' && (
                            <div className="space-y-3">
                                {sortedCosts.map(c => (
                                    <div key={c.id} className="bg-white border p-4 rounded-2xl flex justify-between items-center shadow-sm">
                                        <span className="font-bold text-sm">{c.item}</span>
                                        <div className="text-right flex items-center gap-2">
                                            <p className="font-bold text-red-500">-${Number(c.amount).toLocaleString()}</p>
                                            <button onClick={()=>deleteItem('costs', c.id)} className="text-red-400"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
