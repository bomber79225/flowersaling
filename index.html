<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起賺點零用錢 - 雲端同步小帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        // --- Firebase 初始化 ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'grad-project-2026';
        
        // 您的 Google Apps Script 網址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7qSpHzKkUeDQixbI2eLS9uk9F4J8ZEWx-5O1yEEdOC01cxfh22u3YGiwn4OIfTUvS/exec"; 

        const PARTNERS = ["慧", "芃", "吟", "哲"];
        const STYLES = [
            { id: '藍', label: '藍', color: 'bg-sky-400', active: 'ring-sky-500 bg-sky-50 text-sky-700 border-sky-200' },
            { id: '粉', label: '粉', color: 'bg-[#e2b4bd]', active: 'ring-[#e2b4bd] bg-[#fdf2f4] text-[#a06a75] border-[#f0d4d9]' },
            { id: '黃', label: '黃', color: 'bg-amber-400', active: 'ring-amber-500 bg-amber-50 text-amber-900 border-amber-300' }
        ];
        
        const CHANNELS = {
            "現場擺攤": { price: 499, feeRate: 0 },
            "臉書/賣貨便": { price: 499, feeRate: 0 },
            "蝦皮": { price: 590, feeRate: 0.145 },
            "其他": { price: 499, feeRate: 0 }
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [sales, setSales] = useState([]);
            const [costs, setCosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSyncing, setIsSyncing] = useState(false);

            const [sellerName, setSellerName] = useState(localStorage.getItem('seller_name') || '');
            const [saleForm, setSaleForm] = useState({ 
                channel: '現場擺攤', 
                qty: 1,
                custName: '',
                custPhone: '',
                style: '藍'
            });
            const [costForm, setCostForm] = useState({ item: '', amount: '' });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth init failed", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubSales = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), 
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setSales(data.sort((a, b) => b.timestamp - a.timestamp));
                        setLoading(false);
                        setTimeout(() => lucide.createIcons(), 100);
                    },
                    (error) => console.error("Sales Error:", error)
                );
                const unsubCosts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'costs'), 
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setCosts(data);
                        setTimeout(() => lucide.createIcons(), 100);
                    },
                    (error) => console.error("Costs Error:", error)
                );
                return () => { unsubSales(); unsubCosts(); };
            }, [user]);

            useEffect(() => { lucide.createIcons(); }, [activeTab]);

            const syncToGoogle = async (payload) => {
                if (!GAS_WEB_APP_URL) return;
                setIsSyncing(true);
                try {
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { console.error("GAS Sync failed:", e); }
                finally { setTimeout(() => setIsSyncing(false), 1000); }
            };

            const stats = useMemo(() => {
                const totalFixedCost = costs.reduce((sum, c) => sum + Number(c.amount), 0);
                const totalGrossRevenue = sales.reduce((sum, s) => sum + Number(s.gross), 0);
                const totalFees = sales.reduce((sum, s) => sum + Number(s.fee), 0);
                const totalQty = sales.reduce((sum, s) => sum + Number(s.qty || 0), 0);
                const netRevenue = totalGrossRevenue - totalFees;
                const profit = netRevenue - totalFixedCost;
                const breakEvenProgress = totalFixedCost > 0 ? Math.min((netRevenue / totalFixedCost) * 100, 100) : 0;
                return { totalFixedCost, totalGrossRevenue, totalFees, netRevenue, profit, breakEvenProgress, totalQty };
            }, [sales, costs]);

            const handleAddSale = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!sellerName) return alert("請先選擇銷售員");
                const config = CHANNELS[saleForm.channel];
                const gross = config.price * saleForm.qty;
                const fee = Math.round(gross * config.feeRate);
                const newSale = { ...saleForm, seller: sellerName, gross, fee, timestamp: Date.now() };
                const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sales'), newSale);
                syncToGoogle({ action: "addSale", id: docRef.id, date: new Date(newSale.timestamp).toLocaleString('zh-TW'), ...newSale });
                setSaleForm({ ...saleForm, custName: '', custPhone: '', qty: 1 });
            };

            const handleAddCost = async (e) => {
                e.preventDefault();
                if (!user) return;
                const newCost = { item: costForm.item, amount: Number(costForm.amount), timestamp: Date.now() };
                const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'costs'), newCost);
                syncToGoogle({ action: "addCost", id: docRef.id, date: new Date(newCost.timestamp).toLocaleString('zh-TW'), ...newCost });
                setCostForm({ item: '', amount: '' });
            };

            const deleteItem = async (type, id) => {
                if (!user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', type, id));
                    syncToGoogle({ action: "delete", type, id });
                } catch (err) {
                    console.error("Delete failed", err);
                }
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white">
                    <div className="w-12 h-12 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                    <p className="text-slate-400 font-bold">同步中...</p>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 shadow-xl bg-white relative border-x border-slate-200">
                    <header className="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg relative">
                        {isSyncing && (
                            <div className="absolute top-3 right-4 flex items-center gap-1.5 text-[10px] bg-yellow-400 text-blue-900 px-3 py-1 rounded-full font-black animate-pulse shadow-sm z-20">
                                <i data-lucide="refresh-cw" className="w-3 h-3 animate-spin"></i> 雲端同步中
                            </div>
                        )}
                        <h1 className="text-xl font-bold flex items-center gap-2 mb-4">
                            <i data-lucide="sparkles"></i> 一起賺點零用錢
                        </h1>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">累計銷售</p>
                                <p className="text-2xl font-bold">{stats.totalQty} / 200</p>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">當前淨利</p>
                                <p className="text-2xl font-bold">${stats.profit.toLocaleString()}</p>
                            </div>
                        </div>
                        <div className="mt-5">
                            <div className="flex justify-between text-[10px] text-blue-100 mb-1 font-bold italic">
                                <span>Break-even Progress</span>
                                <span>{stats.breakEvenProgress.toFixed(1)}%</span>
                            </div>
                            <div className="w-full bg-blue-900/40 rounded-full h-2 overflow-hidden">
                                <div className="bg-green-400 h-full transition-all duration-1000" style={{width: `${stats.breakEvenProgress}%`}}></div>
                            </div>
                        </div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-10 shadow-sm">
                        {['dashboard', 'sales', 'costs'].map(tab => (
                            <button key={tab} onClick={()=>setActiveTab(tab)} className={`flex-1 py-4 text-sm font-bold transition-all ${activeTab===tab?'text-blue-600 border-b-2 border-blue-600 bg-blue-50/30':'text-slate-400'}`}>
                                {tab==='dashboard'?'控制台':tab==='sales'?'銷售流水':'支出'}
                            </button>
                        ))}
                    </nav>

                    <main className="p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <section className="bg-white border rounded-2xl p-5 shadow-sm">
                                    <h2 className="font-bold text-slate-700 mb-3 text-xs uppercase tracking-widest opacity-60">銷售員選取</h2>
                                    <div className="grid grid-cols-4 gap-2 mb-6">
                                        {PARTNERS.map(name => (
                                            <button key={name} onClick={() => { setSellerName(name); localStorage.setItem('seller_name', name); }}
                                                className={`py-3 rounded-xl font-bold transition-all border-2 ${sellerName === name ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-400'}`}>{name}</button>
                                        ))}
                                    </div>

                                    <h2 className="font-bold text-slate-700 mb-4 text-xs uppercase tracking-widest opacity-60">新訂單登記</h2>
                                    <form onSubmit={handleAddSale} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="col-span-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶姓名</label>
                                                <input type="text" placeholder="例: 林同學" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-1 focus:ring-blue-100" value={saleForm.custName} onChange={(e)=>setSaleForm({...saleForm, custName: e.target.value})} />
                                            </div>
                                            <div className="col-span-1">
                                                <label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶電話</label>
                                                <input type="number" inputmode="numeric" pattern="[0-9]*" placeholder="末三碼" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-1 focus:ring-blue-100" value={saleForm.custPhone} onChange={(e)=>setSaleForm({...saleForm, custPhone: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">銷售通路</label>
                                                <select className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none appearance-none" value={saleForm.channel} onChange={(e)=>setSaleForm({...saleForm, channel: e.target.value})}>
                                                    {Object.keys(CHANNELS).map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">數量</label>
                                                <input type="number" inputmode="numeric" min="1" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold" value={saleForm.qty} onChange={(e)=>setSaleForm({...saleForm, qty: Number(e.target.value)})} />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 ml-1 mb-2 block uppercase tracking-widest">款式選擇</label>
                                            <div className="flex gap-2">
                                                {STYLES.map(s => (
                                                    <button key={s.id} type="button" onClick={() => setSaleForm({...saleForm, style: s.id})}
                                                        className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 
                                                        ${saleForm.style === s.id ? s.active : 'bg-white border-slate-100 text-slate-400'}`}>
                                                        <span className={`w-3 h-3 rounded-full ${s.color} border border-black/5`}></span>
                                                        {s.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-black shadow-lg shadow-blue-200 active:scale-95 transition-all">登記售出</button>
                                    </form>
                                </section>
                            </div>
                        )}

                        {activeTab === 'sales' && (
                            <div className="space-y-3">
                                {sales.map(s => (
                                    <div key={s.id} className="bg-white border border-slate-100 p-4 rounded-2xl flex justify-between items-center shadow-sm relative overflow-hidden animate-in fade-in slide-in-from-bottom-2 duration-300">
                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${s.style === '藍' ? 'bg-sky-400' : s.style === '粉' ? 'bg-[#e2b4bd]' : 'bg-amber-400'}`}></div>
                                        <div className="flex gap-3 items-center">
                                            <div className="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 font-bold text-xs border uppercase">{s.seller?.[0]}</div>
                                            <div className="flex flex-col">
                                                <div className="flex items-center gap-2 font-black text-slate-800">
                                                    <span>{s.style}束 × {s.qty}</span>
                                                    <span className="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400 font-bold">{s.channel}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-400 mt-0.5">客: {s.custName || '-'} | 電: {s.custPhone || '-'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right flex items-center gap-4">
                                            <p className="font-black text-blue-600 text-lg">+${(s.gross - s.fee).toLocaleString()}</p>
                                            <button onClick={()=>deleteItem('sales', s.id)} className="w-9 h-9 rounded-full bg-red-50 text-red-300 hover:text-red-500 transition-colors flex items-center justify-center">
                                                <i data-lucide="x-circle" className="w-5 h-5"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'costs' && (
                            <div className="space-y-4">
                                <form onSubmit={handleAddCost} className="bg-slate-900 p-5 rounded-2xl flex flex-col gap-3 shadow-inner">
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="支出項目" className="flex-1 p-3 bg-white/10 text-white rounded-xl outline-none text-sm placeholder:text-white/20" value={costForm.item} onChange={(e)=>setCostForm({...costForm, item: e.target.value})} required />
                                        <input type="number" inputmode="numeric" placeholder="金額" className="w-24 p-3 bg-white/10 text-white rounded-xl outline-none text-sm font-bold" value={costForm.amount} onChange={(e)=>setCostForm({...costForm, amount: e.target.value})} required />
                                        <button className="bg-white text-slate-900 px-4 rounded-xl font-black active:scale-90 transition-transform text-xl">+</button>
                                    </div>
                                </form>
                                <div className="divide-y divide-slate-100">
                                    {costs.map(c => (
                                        <div key={c.id} className="flex justify-between p-4 bg-white items-center group">
                                            <div><span className="font-bold text-slate-600">{c.item}</span><p className="text-[9px] text-slate-300">{new Date(c.timestamp).toLocaleDateString()}</p></div>
                                            <div className="flex items-center gap-4">
                                                <span className="font-black text-red-500 text-lg">-${Number(c.amount).toLocaleString()}</span>
                                                <button onClick={()=>deleteItem('costs', c.id)} className="text-slate-100 hover:text-red-400 transition-colors">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="fixed bottom-0 max-w-md w-full bg-white/80 backdrop-blur-md border-t p-3 text-[9px] text-center text-slate-400 font-bold uppercase tracking-widest">
                        一起賺點零用錢 · 雲端同步系統
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        window.addEventListener('load', () => { setTimeout(() => lucide.createIcons(), 500); });
    </script>
</body>
</html>
