<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起賺點零用錢 - 雲端小帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 設定區 ---
        // 請確保這是您最新的 Google Apps Script 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycby7qSpHzKkUeDQixbI2eLS9uk9F4J8ZEWx-5O1yEEdOC01cxfh22u3YGiwn4OIfTUvS/exec"; 

        const PARTNERS = ["慧", "芃", "吟", "哲"];
        const STYLES = [
            { id: '藍', label: '藍', color: 'bg-sky-400', active: 'ring-sky-500 bg-sky-50 text-sky-700 border-sky-200' },
            { id: '粉', label: '粉', color: 'bg-[#e2b4bd]', active: 'ring-[#e2b4bd] bg-[#fdf2f4] text-[#a06a75] border-[#f0d4d9]' },
            { id: '黃', label: '黃', color: 'bg-amber-400', active: 'ring-amber-500 bg-amber-50 text-amber-900 border-amber-300' }
        ];
        const CHANNELS = {
            "現場擺攤": { price: 499, feeRate: 0 },
            "臉書/賣貨便": { price: 499, feeRate: 0 },
            "蝦皮": { price: 590, feeRate: 0.145 },
            "其他": { price: 499, feeRate: 0 }
        };

        const App = () => {
            const [sales, setSales] = useState([]);
            const [costs, setCosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSyncing, setIsSyncing] = useState(false);

            const [sellerName, setSellerName] = useState(localStorage.getItem('seller_name') || '');
            const [saleForm, setSaleForm] = useState({ channel: '現場擺攤', qty: 1, custName: '', custPhone: '', style: '藍' });
            const [costForm, setCostForm] = useState({ item: '', amount: '' });

            // 從 Google 試算表讀取資料
            const fetchData = async () => {
                try {
                    const res = await fetch(GAS_URL);
                    const data = await res.json();
                    setSales(data.sales || []);
                    setCosts(data.costs || []);
                } catch (e) { console.error("讀取失敗", e); }
                finally { setLoading(false); }
            };

            useEffect(() => { fetchData(); }, []);
            useEffect(() => { lucide.createIcons(); }, [activeTab, loading, sales]);

            const syncToGAS = async (payload) => {
                setIsSyncing(true);
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(payload)
                    });
                    if (payload.action !== "delete") {
                        // 為了效能，新增時先手動更新本地狀態，不重新抓整份表
                        if (payload.action === "addSale") {
                            setSales(prev => [payload, ...prev]);
                        } else {
                            setCosts(prev => [...prev, payload]);
                        }
                    } else {
                        // 刪除則重新抓取
                        fetchData();
                    }
                } catch (e) { console.error(e); }
                finally { setTimeout(() => setIsSyncing(false), 800); }
            };

            const stats = useMemo(() => {
                const totalFixedCost = costs.reduce((sum, c) => sum + Number(c.amount || 0), 0);
                const totalGrossRevenue = sales.reduce((sum, s) => sum + Number(s.gross || 0), 0);
                const totalFees = sales.reduce((sum, s) => sum + Number(s.fee || 0), 0);
                const totalQty = sales.reduce((sum, s) => sum + Number(s.qty || 0), 0);
                const netRevenue = totalGrossRevenue - totalFees;
                const profit = netRevenue - totalFixedCost;
                const breakEvenProgress = totalFixedCost > 0 ? Math.min((netRevenue / totalFixedCost) * 100, 100) : 0;
                return { totalFixedCost, totalGrossRevenue, totalFees, netRevenue, profit, breakEvenProgress, totalQty };
            }, [sales, costs]);

            const handleAddSale = (e) => {
                e.preventDefault();
                if (!sellerName) return alert("請先選銷售員");
                const config = CHANNELS[saleForm.channel];
                const gross = config.price * saleForm.qty;
                const fee = Math.round(gross * config.feeRate);
                const newSale = { 
                    ...saleForm, 
                    action: "addSale",
                    id: 'S' + Date.now(), 
                    timestamp: Date.now(),
                    seller: sellerName, 
                    gross, 
                    fee 
                };
                syncToGAS(newSale);
                setSaleForm({ ...saleForm, custName: '', custPhone: '', qty: 1 });
            };

            const handleAddCost = (e) => {
                e.preventDefault();
                const newCost = { 
                    action: "addCost",
                    id: 'C' + Date.now(),
                    timestamp: Date.now(),
                    item: costForm.item, 
                    amount: Number(costForm.amount) 
                };
                syncToGAS(newCost);
                setCostForm({ item: '', amount: '' });
            };

            const deleteItem = (type, id) => {
                if (type === 'sales') setSales(sales.filter(s => s.id != id));
                else setCosts(costs.filter(c => c.id != id));
                syncToGAS({ action: "delete", type, id });
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white p-10">
                    <div className="w-16 h-1 w-full bg-slate-100 rounded-full overflow-hidden mb-4">
                        <div className="h-full bg-blue-600 w-1/2 animate-[shimmer_1.5s_infinite]"></div>
                    </div>
                    <p className="text-slate-400 font-bold text-sm tracking-widest animate-pulse">連線至 Google 試算表...</p>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 shadow-xl bg-white relative border-x border-slate-100">
                    <header className="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg relative">
                        {isSyncing && (
                            <div className="absolute top-3 right-4 flex items-center gap-1.5 text-[10px] bg-yellow-400 text-blue-900 px-3 py-1 rounded-full font-black animate-pulse z-20">
                                <i data-lucide="refresh-cw" className="w-3 h-3 animate-spin"></i> 同步中
                            </div>
                        )}
                        <h1 className="text-xl font-bold flex items-center gap-2 mb-4">
                            <i data-lucide="sparkles"></i> 一起賺點零用錢
                        </h1>
                        <div className="grid grid-cols-2 gap-4 text-center">
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">累計銷售</p>
                                <p className="text-2xl font-bold">{stats.totalQty} / 200</p>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">預估淨利</p>
                                <p className="text-2xl font-bold">${stats.profit.toLocaleString()}</p>
                            </div>
                        </div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-10">
                        {['dashboard', 'sales', 'costs'].map(tab => (
                            <button key={tab} onClick={()=>setActiveTab(tab)} className={`flex-1 py-4 text-xs font-bold transition-all ${activeTab===tab?'text-blue-600 border-b-2 border-blue-600 bg-blue-50/30':'text-slate-400'}`}>
                                {tab==='dashboard'?'控制台':tab==='sales'?'銷售流水':'支出'}
                            </button>
                        ))}
                    </nav>

                    <main className="p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <section className="bg-white border rounded-2xl p-5 shadow-sm">
                                    <h2 className="font-bold text-slate-700 mb-3 text-[10px] uppercase tracking-widest opacity-60">銷售員</h2>
                                    <div className="grid grid-cols-4 gap-2 mb-6">
                                        {PARTNERS.map(name => (
                                            <button key={name} onClick={() => { setSellerName(name); localStorage.setItem('seller_name', name); }}
                                                className={`py-3 rounded-xl font-bold transition-all border-2 ${sellerName === name ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-400'}`}>{name}</button>
                                        ))}
                                    </div>

                                    <h2 className="font-bold text-slate-700 mb-4 text-[10px] uppercase tracking-widest opacity-60">新訂單登記</h2>
                                    <form onSubmit={handleAddSale} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="col-span-1"><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶姓名</label>
                                                <input type="text" placeholder="例: 林同學" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-1 focus:ring-blue-100" value={saleForm.custName} onChange={(e)=>setSaleForm({...saleForm, custName: e.target.value})} />
                                            </div>
                                            <div className="col-span-1"><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶電話</label>
                                                <input type="number" inputmode="numeric" placeholder="末三碼" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-1 focus:ring-blue-100" value={saleForm.custPhone} onChange={(e)=>setSaleForm({...saleForm, custPhone: e.target.value})} />
                                            </div>
                                            <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">銷售通路</label>
                                                <select className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none appearance-none" value={saleForm.channel} onChange={(e)=>setSaleForm({...saleForm, channel: e.target.value})}>
                                                    {Object.keys(CHANNELS).map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">數量</label>
                                                <input type="number" inputmode="numeric" min="1" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold" value={saleForm.qty} onChange={(e)=>setSaleForm({...saleForm, qty: Number(e.target.value)})} />
                                            </div>
                                        </div>
                                        <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-2 block uppercase tracking-widest">款式選擇</label>
                                            <div className="flex gap-2">
                                                {STYLES.map(s => (
                                                    <button key={s.id} type="button" onClick={() => setSaleForm({...saleForm, style: s.id})}
                                                        className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 ${saleForm.style === s.id ? s.active : 'bg-white border-slate-100 text-slate-400'}`}>
                                                        <span className={`w-3 h-3 rounded-full ${s.color} border border-black/5`}></span>{s.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all">登記售出</button>
                                    </form>
                                </section>
                            </div>
                        )}

                        {activeTab === 'sales' && (
                            <div className="space-y-3">
                                {sales.length === 0 && <div className="text-center py-20 opacity-20 font-bold text-xs">目前尚無銷售紀錄</div>}
                                {sales.map(s => (
                                    <div key={s.id} className="bg-white border border-slate-100 p-4 rounded-2xl flex justify-between items-center shadow-sm relative overflow-hidden">
                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${s.style === '藍' ? 'bg-sky-400' : s.style === '粉' ? 'bg-[#e2b4bd]' : 'bg-amber-400'}`}></div>
                                        <div className="flex gap-3 items-center">
                                            <div className="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 font-bold text-[10px] border uppercase">{s.seller?.[0]}</div>
                                            <div className="flex flex-col">
                                                <div className="flex items-center gap-2 font-black text-slate-800 text-sm">
                                                    <span>{s.style}束 × {s.qty}</span>
                                                    <span className="text-[8px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400 font-bold">{s.channel}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-400">客: {s.custname || s.custName || '-'} | 電: {s.custphone || s.custPhone || '-'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right flex items-center gap-3">
                                            <p className="font-black text-blue-600 text-base">+${(Number(s.gross) - Number(s.fee)).toLocaleString()}</p>
                                            <button onClick={()=>deleteItem('sales', s.id)} className="text-red-200 hover:text-red-500 transition-colors"><i data-lucide="x-circle" className="w-5 h-5"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'costs' && (
                            <div className="space-y-4">
                                <form onSubmit={handleAddCost} className="bg-slate-900 p-5 rounded-2xl flex gap-2 shadow-inner">
                                    <input type="text" placeholder="項目" className="flex-1 p-3 bg-white/10 text-white rounded-xl outline-none text-sm placeholder:text-white/20" value={costForm.item} onChange={(e)=>setCostForm({...costForm, item: e.target.value})} required />
                                    <input type="number" inputmode="numeric" placeholder="金額" className="w-20 p-3 bg-white/10 text-white rounded-xl outline-none text-sm font-bold" value={costForm.amount} onChange={(e)=>setCostForm({...costForm, amount: e.target.value})} required />
                                    <button className="bg-white text-slate-900 px-4 rounded-xl font-black active:scale-90 transition-transform"><i data-lucide="plus" className="w-5 h-5"></i></button>
                                </form>
                                <div className="divide-y divide-slate-100 bg-white rounded-2xl border shadow-sm px-4">
                                    {costs.length === 0 && <p className="text-center py-10 opacity-20 text-xs font-bold">尚無支出紀錄</p>}
                                    {costs.map(c => (
                                        <div key={c.id} className="flex justify-between py-4 items-center">
                                            <div><span className="font-bold text-slate-600">{c.item}</span><p className="text-[9px] text-slate-300">{new Date(Number(c.timestamp)).toLocaleDateString()}</p></div>
                                            <div className="flex items-center gap-4">
                                                <span className="font-black text-red-500">-${Number(c.amount).toLocaleString()}</span>
                                                <button onClick={()=>deleteItem('costs', c.id)} className="text-slate-200 hover:text-red-400"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="fixed bottom-0 max-w-md w-full bg-white/80 backdrop-blur-md border-t p-3 text-[9px] text-center text-slate-400 font-bold uppercase tracking-widest">
                        畢業專案流水帳 · 純雲端試算表驅動
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
