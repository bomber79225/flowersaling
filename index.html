<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一起賺點零用錢 - 擺攤正式戰鬥版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // 已對接您專屬的 Google Apps Script 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycby7qSpHzKkUeDQixbI2eLS9uk9F4J8ZEWx-5O1yEEdOC01cxfh22u3YGiwn4OIfTUvS/exec"; 

        const PARTNERS = ["慧", "芃", "吟", "哲"];
        const STYLES = [
            { id: '藍', label: '藍韻', color: 'bg-sky-400', active: 'ring-sky-500 bg-sky-50 text-sky-700 border-sky-200' },
            { id: '粉', label: '粉馨', color: 'bg-[#e2b4bd]', active: 'ring-[#e2b4bd] bg-[#fdf2f4] text-[#a06a75] border-[#f0d4d9]' },
            { id: '黃', label: '暖陽', color: 'bg-amber-400', active: 'ring-amber-500 bg-amber-50 text-amber-900 border-amber-300' }
        ];
        
        const CHANNELS = {
            "現場擺攤": { price: 699, feeRate: 0 },
            "臉書/賣貨便": { price: 499, feeRate: 0 },
            "蝦皮": { price: 590, feeRate: 0.145 },
            "其他": { price: 499, feeRate: 0 }
        };

        // 安全無衝突 原生 SVG 圖標元件 (100% 正式修復)
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                sparkles: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                        <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5 5 3Z"/>
                    </svg>
                ),
                clock: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                ),
                plus: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="12" x2="12" y1="5" y2="19"/>
                        <line x1="5" x2="19" y1="12" y2="12"/>
                    </svg>
                ),
                check: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                ),
                trash: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    </svg>
                ),
                undo: (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 7v6h6"/>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                    </svg>
                ),
                "refresh-cw": (
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M16 16h5v5"/>
                    </svg>
                )
            };
            return icons[name] || null;
        };

        const App = () => {
            const [sales, setSales] = useState([]);
            const [costs, setCosts] = useState([]);
            
            // 💡 垃圾回收桶狀態
            const [trash, setTrash] = useState([]);

            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSyncing, setIsSyncing] = useState(false);
            const [lastSyncTime, setLastSyncTime] = useState('正在同步中...');

            // 智慧 LocalStorage 讀取防護，防止 Iframe 沙盒環境安全報錯導致白畫面
            const [sellerName, setSellerName] = useState(() => {
                try {
                    return localStorage.getItem('seller_name') || '';
                } catch (e) {
                    return '';
                }
            });

            const [saleForm, setSaleForm] = useState({ channel: '現場擺攤', qty: 1, custName: '', custPhone: '', style: '藍', price: 699 });
            const [costForm, setCostForm] = useState({ item: '', amount: '' });
            const [quickPrice, setQuickPrice] = useState(699);
            const [toastMessage, setToastMessage] = useState('');
            const [warningMessage, setWarningMessage] = useState('');

            // 從 Google 試算表抓取最新真實資料 (包含活耀表與回收桶)
            const fetchData = useCallback(async (isSilent = false) => {
                if (!isSilent) setLoading(true);
                try {
                    const res = await fetch(`${GAS_URL}?t=${Date.now()}`, { 
                        method: 'GET',
                        cache: 'no-store'
                    });
                    const data = await res.json();
                    if (data && !data.error) {
                        setSales(data.sales || []);
                        setCosts(data.costs || []);
                        setTrash(data.trash || []); // 💡 同步雲端回收桶數據
                        setLastSyncTime(new Date().toLocaleTimeString('zh-TW', { hour12: false }));
                    }
                } catch (e) { 
                    console.error("讀取失敗", e);
                    setLastSyncTime('連線失敗 (請確認網路)');
                } finally { 
                    setLoading(false); 
                }
            }, []);

            useEffect(() => { 
                fetchData(); 
                
                // 1. 切換回網頁時自動重新整理
                const handleFocus = () => fetchData(true);
                window.addEventListener('focus', handleFocus);
                
                // 2. 每 45 秒自動刷新
                const timer = setInterval(() => fetchData(true), 45000);
                
                return () => {
                    window.removeEventListener('focus', handleFocus);
                    clearInterval(timer);
                };
            }, [fetchData]);

            // 當選單通路變動時，自動切換該通路預設價格
            useEffect(() => {
                const config = CHANNELS[saleForm.channel];
                setSaleForm(prev => ({ ...prev, price: config.price }));
            }, [saleForm.channel]);

            const syncToGAS = async (payload) => {
                setIsSyncing(true);
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    // 秒級延遲以利 GAS 完全寫入，後台流暢刷新
                    setTimeout(() => fetchData(true), 1500);
                } catch (e) { 
                    console.error("傳送失敗", e);
                } finally { 
                    setTimeout(() => setIsSyncing(false), 1000); 
                }
            };

            // 解決 Number() 轉型 ISO 字串為 NaN 的 Bug：使用原生 Date.getTime 進行智慧毫秒解析
            const parseTime = (val) => {
                if (!val) return 0;
                const d = new Date(val);
                return isNaN(d.getTime()) ? 0 : d.getTime();
            };

            // 💡 排序邏輯：新到舊 (越新越在上方)
            const sortedSales = useMemo(() => {
                return [...sales].sort((a, b) => parseTime(b.timestamp) - parseTime(a.timestamp));
            }, [sales]);

            const sortedCosts = useMemo(() => {
                return [...costs].sort((a, b) => parseTime(b.timestamp) - parseTime(a.timestamp));
            }, [costs]);

            const sortedTrash = useMemo(() => {
                return [...trash].sort((a, b) => parseTime(b.deletedAt || b.timestamp) - parseTime(a.deletedAt || a.timestamp));
            }, [trash]);

            const stats = useMemo(() => {
                const totalFixedCost = costs.reduce((sum, c) => sum + Number(c.amount || 0), 0);
                const totalGrossRevenue = sales.reduce((sum, s) => sum + Number(s.gross || 0), 0);
                const totalFees = sales.reduce((sum, s) => sum + Number(s.fee || 0), 0);
                const totalQty = sales.reduce((sum, s) => sum + Number(s.qty || 0), 0);
                const profit = (totalGrossRevenue - totalFees) - totalFixedCost;
                return { totalFixedCost, totalGrossRevenue, totalFees, profit, totalQty };
            }, [sales, costs]);

            // 擺攤專用快捷收銀
            const handleQuickSale = (style) => {
                setWarningMessage('');
                if (!sellerName) {
                    setWarningMessage("⚠️ 請先在上方選取您的「當前收銀員」身分唷！");
                    return;
                }
                const newSale = {
                    action: "addSale",
                    id: 'S' + Date.now(),
                    timestamp: Date.now(),
                    channel: '現場擺攤',
                    qty: 1,
                    style: style,
                    custName: '現場客',
                    custPhone: '無',
                    gross: quickPrice,
                    fee: 0,
                    seller: sellerName
                };
                // 本地瞬跑
                setSales(prev => [newSale, ...prev]);
                syncToGAS(newSale);
                
                // 炫酷飄浮提示
                setToastMessage(`已登記：${style}花束 1 束 ($${quickPrice})`);
                setTimeout(() => setToastMessage(''), 2000);
            };

            const handleAddSale = (e) => {
                e.preventDefault();
                setWarningMessage('');
                if (!sellerName) {
                    setWarningMessage("⚠️ 請先在上方選取您的「當前收銀員」身分唷！");
                    return;
                }
                const config = CHANNELS[saleForm.channel];
                const gross = saleForm.price * saleForm.qty;
                const fee = Math.round(gross * config.feeRate);
                const newSale = { 
                    ...saleForm, 
                    action: "addSale",
                    id: 'S' + Date.now(), 
                    timestamp: Date.now(),
                    seller: sellerName, 
                    gross, 
                    fee 
                };
                setSales(prev => [newSale, ...prev]);
                syncToGAS(newSale);
                setSaleForm({ ...saleForm, custName: '', custPhone: '', qty: 1 });
            };

            const handleAddCost = (e) => {
                e.preventDefault();
                const newCost = { 
                    action: "addCost",
                    id: 'C' + Date.now(),
                    timestamp: Date.now(),
                    item: costForm.item, 
                    amount: Number(costForm.amount) 
                };
                setCosts(prev => [newCost, ...prev]);
                syncToGAS(newCost);
                setCostForm({ item: '', amount: '' });
            };

            // 💡 一鍵刪除：移至「雲端垃圾回收桶」，不永久刪除
            const deleteItem = (type, item) => {
                const trashItem = {
                    ...item,
                    type: type, // 'sales' 或 'costs'
                    deletedAt: Date.now()
                };

                // 1. 先在本機做狀態更新（秒級反應）
                setTrash(prev => [trashItem, ...prev]);
                if (type === 'sales') {
                    setSales(prev => prev.filter(s => s.id !== item.id));
                } else {
                    setCosts(prev => prev.filter(c => c.id !== item.id));
                }

                // 2. 同步至 GAS：通知雲端將此資料安全移入回收表
                syncToGAS({ action: "delete", type, id: item.id });

                setToastMessage(`🗑️ 資料已移至雲端回收桶！`);
                setTimeout(() => setToastMessage(''), 2000);
            };

            // 💡 一鍵復原：從雲端垃圾回收桶恢復，重新寫入活耀表
            const restoreItem = (trashItem) => {
                const { type, deletedAt, ...originalItem } = trashItem;

                // 1. 本地更新狀態
                setTrash(prev => prev.filter(t => t.id !== trashItem.id));
                if (type === 'sales') {
                    setSales(prev => [originalItem, ...prev]);
                } else {
                    setCosts(prev => [originalItem, ...prev]);
                }

                // 2. 同步至 GAS：通知雲端將此資料放回並從回收桶刪除
                syncToGAS({ action: "restore", type, id: originalItem.id });

                setToastMessage(`🔄 已成功將資料自雲端還原！`);
                setTimeout(() => setToastMessage(''), 2000);
            };

            // 智慧 LocalStorage 寫入防護
            const selectSeller = (name) => {
                setSellerName(name);
                try {
                    localStorage.setItem('seller_name', name);
                } catch (e) {
                    console.warn("LocalStorage blocked in sandbox iframe.");
                }
                setWarningMessage('');
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-white p-10 text-center">
                    <div className="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                    <p className="text-slate-400 font-bold text-sm tracking-widest animate-pulse">正在同步雲端資料庫...</p>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen pb-20 shadow-xl bg-white relative border-x border-slate-100">
                    
                    {/* 飄浮提示通知 */}
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-black py-2.5 px-5 rounded-full shadow-2xl text-xs z-50 animate-bounce flex items-center gap-1.5 border border-amber-300">
                            <Icon name="check" className="w-4 h-4" />
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    <header className="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg relative">
                        {isSyncing && (
                            <div className="absolute top-3 right-4 flex items-center gap-1.5 text-[10px] bg-yellow-400 text-blue-900 px-3 py-1 rounded-full font-black animate-pulse z-20">
                                <Icon name="refresh-cw" className="w-3 h-3 animate-spin" /> 正在寫入
                            </div>
                        )}
                        <h1 className="text-xl font-bold flex items-center gap-2 mb-1">
                            <Icon name="sparkles" /> 一起賺點零用錢
                        </h1>
                        <p className="text-blue-100/60 text-[10px] mb-4 flex items-center gap-1">
                            <Icon name="clock" className="w-2.5 h-2.5" /> 最後同步：{lastSyncTime}
                        </p>
                        <div className="grid grid-cols-2 gap-4 text-center">
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">全體累計銷售</p>
                                <p className="text-2xl font-bold">{stats.totalQty} / 200</p>
                            </div>
                            <div className="bg-white/10 p-3 rounded-xl border border-white/10">
                                <p className="text-blue-100 text-[10px] font-bold uppercase tracking-widest">目前預估淨利</p>
                                <p className={`text-2xl font-bold ${stats.profit < 0 ? 'text-red-300' : 'text-green-300'}`}>${stats.profit.toLocaleString()}</p>
                            </div>
                        </div>
                    </header>

                    <nav className="flex bg-white border-b sticky top-0 z-10 shadow-sm">
                        {['dashboard', 'sales', 'costs', 'trash'].map(tab => (
                            <button key={tab} onClick={()=>setActiveTab(tab)} className={`flex-1 py-4 text-xs font-bold transition-all relative ${activeTab===tab?'text-blue-600 border-b-2 border-blue-600 bg-blue-50/30':'text-slate-400'}`}>
                                {tab==='dashboard'?'控制台':tab==='sales'?'流水帳':tab==='costs'?'支出':'回收桶'}
                                {tab==='trash' && trash.length > 0 && (
                                    <span className="absolute top-2 right-2 bg-red-500 text-white font-black text-[9px] w-4.5 h-4.5 rounded-full flex items-center justify-center scale-90">{trash.length}</span>
                                )}
                            </button>
                        ))}
                    </nav>

                    <main className="p-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                
                                {/* 銷售員設定 */}
                                <section className="bg-white border rounded-2xl p-4 shadow-sm">
                                    <h2 className="font-bold text-slate-700 mb-2.5 text-[10px] uppercase tracking-widest opacity-60">當前收銀員</h2>
                                    <div className="grid grid-cols-4 gap-2">
                                        {PARTNERS.map(name => (
                                            <button key={name} type="button" onClick={() => selectSeller(name)}
                                                className={`py-2.5 rounded-xl font-bold transition-all border-2 ${sellerName === name ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-400'}`}>{name}</button>
                                        ))}
                                    </div>
                                    {warningMessage && (
                                        <p className="text-xs text-red-500 font-bold mt-2 animate-pulse">{warningMessage}</p>
                                    )}
                                </section>

                                {/* ⚡ 擺攤現場一鍵收銀 */}
                                <section className="bg-gradient-to-br from-slate-900 to-zinc-950 text-white rounded-2xl p-5 shadow-xl border border-amber-500/30 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 bg-amber-500 text-slate-950 text-[9px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-widest animate-pulse">
                                        擺攤戰鬥模式
                                    </div>
                                    <h3 className="font-bold text-amber-400 mb-3.5 text-xs uppercase tracking-widest flex items-center gap-1.5">
                                        <Icon name="sparkles" className="w-4 h-4 text-amber-500" /> 現場一鍵快捷鍵入
                                    </h3>
                                    
                                    {/* 快速單價覆蓋調整 */}
                                    <div className="mb-5 bg-white/5 p-3 rounded-xl border border-white/5">
                                        <p className="text-[9px] text-slate-400 font-bold mb-2 uppercase tracking-wider">現場設定售價</p>
                                        <div className="flex items-center gap-2">
                                            <span className="text-2xl font-black font-mono text-amber-300">${quickPrice}</span>
                                            <div className="flex gap-1.5 ml-auto">
                                                <button type="button" onClick={() => setQuickPrice(699)} className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-all ${quickPrice === 699 ? 'bg-amber-500 border-amber-500 text-slate-950' : 'bg-white/5 border-white/10 text-slate-300'}`}>$699</button>
                                                <button type="button" onClick={() => setQuickPrice(599)} className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-all ${quickPrice === 599 ? 'bg-amber-500 border-amber-500 text-slate-950' : 'bg-white/5 border-white/10 text-slate-300'}`}>$599</button>
                                                <button type="button" onClick={() => setQuickPrice(499)} className={`px-2.5 py-1 rounded-lg text-xs font-bold border transition-all ${quickPrice === 499 ? 'bg-amber-500 border-amber-500 text-slate-950' : 'bg-white/5 border-white/10 text-slate-300'}`}>$499</button>
                                                <div className="flex border border-white/10 rounded-lg overflow-hidden bg-white/5">
                                                    <button type="button" onClick={() => setQuickPrice(p => Math.max(0, p - 50))} className="px-2 text-slate-400 hover:text-white hover:bg-white/5 font-bold">-50</button>
                                                    <button type="button" onClick={() => setQuickPrice(p => p + 50)} className="px-2 text-slate-400 hover:text-white hover:bg-white/5 font-bold">+50</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* 三色一鍵入帳按鈕 */}
                                    <div className="grid grid-cols-3 gap-2.5">
                                        <button type="button" onClick={() => handleQuickSale('藍')} className="bg-sky-500/10 hover:bg-sky-500/20 active:scale-95 transition-all border border-sky-500/30 p-3.5 rounded-xl flex flex-col items-center gap-1.5">
                                            <span className="w-3 h-3 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
                                            <span className="text-xs font-bold text-sky-200">藍韻 +1</span>
                                        </button>
                                        <button type="button" onClick={() => handleQuickSale('粉')} className="bg-[#e2b4bd]/10 hover:bg-[#e2b4bd]/20 active:scale-95 transition-all border-[#e2b4bd]/30 p-3.5 rounded-xl flex flex-col items-center gap-1.5 border">
                                            <span className="w-3 h-3 rounded-full bg-[#e2b4bd] shadow-[0_0_8px_#e2b4bd]"></span>
                                            <span className="text-xs font-bold text-pink-200">粉馨 +1</span>
                                        </button>
                                        <button type="button" onClick={() => handleQuickSale('黃')} className="bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 transition-all border border-amber-500/30 p-3.5 rounded-xl flex flex-col items-center gap-1.5">
                                            <span className="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24]"></span>
                                            <span className="text-xs font-bold text-amber-200">暖陽 +1</span>
                                        </button>
                                    </div>
                                </section>

                                {/* 常規手動詳細登記 */}
                                <section className="bg-white border rounded-2xl p-5 shadow-sm">
                                    <h2 className="font-bold text-slate-700 mb-4 text-[10px] uppercase tracking-widest opacity-60">詳細訂單補登</h2>
                                    <form onSubmit={handleAddSale} className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="col-span-1"><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶姓名</label>
                                                <input type="text" placeholder="例: 林同學" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none" value={saleForm.custName} onChange={(e)=>setSaleForm({...saleForm, custName: e.target.value})} />
                                            </div>
                                            <div className="col-span-1"><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">客戶電話</label>
                                                <input type="text" placeholder="聯絡資訊" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none" value={saleForm.custPhone} onChange={(e)=>setSaleForm({...saleForm, custPhone: e.target.value})} />
                                            </div>
                                            <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">銷售通路</label>
                                                <select className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none appearance-none" value={saleForm.channel} onChange={(e)=>setSaleForm({...saleForm, channel: e.target.value})}>
                                                    {Object.keys(CHANNELS).map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">自訂單價</label>
                                                <input type="number" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold" value={saleForm.price} onChange={(e)=>setSaleForm({...saleForm, price: Number(e.target.value)})} />
                                            </div>
                                            <div className="col-span-2"><label className="text-[10px] font-bold text-slate-400 ml-1 mb-1 block">售出數量</label>
                                                <input type="number" min="1" className="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold" value={saleForm.qty} onChange={(e)=>setSaleForm({...saleForm, qty: Number(e.target.value)})} />
                                            </div>
                                        </div>
                                        <div><label className="text-[10px] font-bold text-slate-400 ml-1 mb-2 block uppercase tracking-widest">款式選擇</label>
                                            <div className="flex gap-2">
                                                {STYLES.map(s => (
                                                    <button key={s.id} type="button" onClick={() => setSaleForm({...saleForm, style: s.id})}
                                                        className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 ${saleForm.style === s.id ? s.active : 'bg-white border-slate-100 text-slate-400'}`}>
                                                        <span className={`w-3 h-3 rounded-full ${s.color} border border-black/5`}></span>{s.label}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <button className="w-full bg-blue-600 text-white p-4 rounded-xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all">確認登記售出</button>
                                    </form>
                                </section>
                            </div>
                        )}

                        {activeTab === 'sales' && (
                            <div className="space-y-3">
                                {sortedSales.length === 0 && <div className="text-center py-20 opacity-20 font-bold text-xs">目前尚無銷售紀錄</div>}
                                {sortedSales.map(s => (
                                    <div key={s.id} className="bg-white border border-slate-100 p-4 rounded-2xl flex justify-between items-center shadow-sm relative overflow-hidden animate-in fade-in slide-in-from-top-4 duration-300">
                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${s.style === '藍' ? 'bg-sky-400' : s.style === '粉' ? 'bg-[#e2b4bd]' : 'bg-amber-400'}`}></div>
                                        <div className="flex gap-3 items-center">
                                            <div className="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 font-bold text-[10px] border uppercase">{s.seller?.[0]}</div>
                                            <div className="flex flex-col">
                                                <div className="flex items-center gap-2 font-black text-slate-800 text-sm">
                                                    <span>{(s.style || '未知')}束 × {(s.qty || 0)}</span>
                                                    <span className="text-[8px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400 font-bold">{(s.channel || '其他')}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-400">客: {s.custName || s.custname || '-'} | 電: {s.custPhone || s.custphone || '-'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right flex items-center gap-3">
                                            <p className="font-black text-blue-600 text-base">+${(Number(s.gross || 0) - Number(s.fee || 0)).toLocaleString()}</p>
                                            {/* 💡 已將刪除按鈕修復為標準大小 (w-5 h-5) 的高雅紅色線條垃圾桶圖示 */}
                                            <button onClick={()=>deleteItem('sales', s)} className="text-red-400 hover:text-red-600 transition-colors bg-red-50 hover:bg-red-100 p-2 rounded-xl border border-red-100/50"><Icon name="trash" className="w-5 h-5" /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'costs' && (
                            <div className="space-y-4">
                                <form onSubmit={handleAddCost} className="bg-slate-900 p-4 rounded-2xl flex items-center gap-2 shadow-inner">
                                    <input type="text" placeholder="項目" className="w-24 p-3 bg-white/10 text-white rounded-xl outline-none text-sm placeholder:text-white/20" value={costForm.item} onChange={(e)=>setCostForm({...costForm, item: e.target.value})} required />
                                    <input type="number" placeholder="金額" className="flex-1 min-w-0 p-3 bg-white/10 text-white rounded-xl outline-none text-sm font-bold" value={costForm.amount} onChange={(e)=>setCostForm({...costForm, amount: e.target.value})} required />
                                    <button className="bg-white text-slate-900 p-3 rounded-xl font-black flex-shrink-0"><Icon name="plus" className="w-5 h-5" /></button>
                                </form>
                                <div className="divide-y divide-slate-100 bg-white rounded-2xl border shadow-sm px-4">
                                    {sortedCosts.length === 0 && <p className="text-center py-10 opacity-20 text-xs font-bold">尚無支出紀錄</p>}
                                    {sortedCosts.map(c => (
                                        <div key={c.id || c.timestamp} className="flex justify-between py-4 items-center animate-in fade-in duration-300">
                                            <div className="flex-shrink-0 w-24 sm:w-32 truncate mr-2">
                                                <span className="font-bold text-slate-600 block text-sm">{c.item}</span>
                                                <p className="text-[9px] text-slate-300">{new Date(Number(c.timestamp)).toLocaleDateString('zh-TW')}</p>
                                            </div>
                                            <div className="flex-1 text-right flex items-center justify-end gap-3 min-w-0">
                                                <span className="font-black text-red-500 truncate text-sm">-${Number(c.amount || 0).toLocaleString()}</span>
                                                {/* 💡 已將刪除按鈕修復為標準大小 (w-5 h-5) 的高雅紅色線條垃圾桶圖示 */}
                                                <button onClick={()=>deleteItem('costs', c)} className="text-red-400 hover:text-red-600 transition-colors bg-red-50 hover:bg-red-100 p-2 rounded-xl border border-red-100/50"><Icon name="trash" className="w-5 h-5" /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'trash' && (
                            <div className="space-y-3">
                                {sortedTrash.length === 0 && (
                                    <div className="text-center py-20 opacity-20 font-bold text-xs flex flex-col items-center gap-2">
                                        <Icon name="trash" className="w-8 h-8" />
                                        <span>資源回收桶空空如也</span>
                                    </div>
                                )}
                                {sortedTrash.map(t => (
                                    <div key={t.id} className="bg-slate-100/70 border border-slate-200/50 p-4 rounded-2xl flex justify-between items-center shadow-inner relative overflow-hidden animate-in fade-in duration-300">
                                        <div className="flex gap-3 items-center opacity-60">
                                            <div className="w-10 h-10 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-500 font-bold text-[10px] border uppercase">{t.seller?.[0] || '無'}</div>
                                            <div className="flex flex-col">
                                                <div className="flex items-center gap-2 font-black text-slate-500 text-sm line-through">
                                                    <span>{(t.style || t.item || '未知')} {t.qty ? `× ${t.qty}` : ''}</span>
                                                    <span className="text-[8px] bg-slate-200 px-1.5 py-0.5 rounded text-slate-400 font-bold">{t.channel || (t.type === 'costs' ? '支出項目' : '現場客')}</span>
                                                </div>
                                                <p className="text-[9px] text-slate-400">刪除時間: {new Date(t.deletedAt).toLocaleTimeString('zh-TW', { hour12: false })}</p>
                                            </div>
                                        </div>
                                        <div className="text-right flex items-center gap-3">
                                            <p className="font-bold text-slate-400 text-sm line-through">
                                                {t.type === 'sales' ? `+$${(Number(t.gross || 0) - Number(t.fee || 0)).toLocaleString()}` : `-$${Number(t.amount || 0).toLocaleString()}`}
                                            </p>
                                            <button 
                                                onClick={()=>restoreItem(t)} 
                                                className="text-blue-600 hover:text-blue-800 transition-colors bg-blue-50 hover:bg-blue-100 p-2 rounded-xl border border-blue-100"
                                                title="還原復原"
                                            >
                                                <Icon name="undo" className="w-4.5 h-4.5" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                    <footer className="fixed bottom-0 max-w-md w-full bg-white/80 backdrop-blur-md border-t p-3 text-[9px] text-center text-slate-400 font-bold uppercase tracking-widest">
                        全體共享流水帳 · 正式擺攤戰鬥版
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(App ? <App /> : null);
    </script>
</body>
</html>
